<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b54">
  <meta name="robots" content="noindex">
  <title>Свиб-Дом Сервис | Заявка на ремонт</title>
  <style>
    /* Standalone client request page in two steps: pick a service, then say
       what happened and how to reach you (photos welcome). Submits through
       the same Zammad form channel as the partner embed
       (form_config -> form_submit with request_source_token). */
    :root {
      --bg: #f4f1ea;
      --bg-glow: #e4eee6;
      --card: #fffdf9;
      --field: #f8f5ee;
      --ink: #1c2420;
      --muted: #667069;
      --line: #e3ddd0;
      --accent: #1f6b54;
      --accent-deep: #18523f;
      --accent-ink: #ffffff;
      --accent-soft: #e2efe8;
      --warm: #c9531c;
      --warm-soft: #fbe8db;
      --danger: #b3402a;
      --shadow: 0 1px 2px rgba(28, 36, 32, .05), 0 14px 36px rgba(28, 36, 32, .09);
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-head: "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131a17;
        --bg-glow: #1b2a24;
        --card: #1c2521;
        --field: #232d28;
        --ink: #e9efeb;
        --muted: #9eaea7;
        --line: #33403a;
        --accent: #6fc3a6;
        --accent-deep: #8fd6bc;
        --accent-ink: #0f1a16;
        --accent-soft: #24392f;
        --warm: #f0a070;
        --warm-soft: #3b2a20;
        --danger: #f08a74;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .35);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(900px 520px at 12% -8%, var(--bg-glow), transparent 62%), var(--bg);
      color: var(--ink);
      font: 16px/1.5 var(--font);
      padding: max(20px, env(safe-area-inset-top)) 14px max(36px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    header { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
    .mark { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; flex: none; }
    .mark svg { width: 26px; height: 26px; stroke: var(--accent-ink); }
    .brand { font-weight: 700; font-size: 17px; line-height: 1.2; }
    .tag { color: var(--muted); font-size: 13px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 20px 18px 20px; }
    .step { display: flex; flex-direction: column; gap: 16px; animation: in .28s ease; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .steps { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
    .steps i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); }
    .steps i.on { background: var(--accent); }
    .steps span { flex: none; }

    h1 { font-family: var(--font-head); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
    h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -4px; display: flex; align-items: center; gap: 10px; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .hint { color: var(--muted); margin: -8px 0 0; font-size: 14.5px; }

    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input[type="checkbox"]:focus-visible, .add:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Step 1: services */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; min-height: 118px; padding: 14px 14px 13px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--field); transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
    .tile:hover { border-color: var(--ic); box-shadow: 0 6px 18px rgba(28, 36, 32, .08); transform: translateY(-1px); }
    .tile:active { transform: scale(.985); }
    .tile[aria-pressed="true"] { border-color: var(--ic); }
    .tile b { display: block; font-weight: 650; font-size: 15.5px; line-height: 1.2; }
    .tile small { display: block; margin-top: 3px; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
    .badge { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--accent-soft); background: color-mix(in srgb, var(--ic) 15%, transparent); }
    .badge svg { width: 24px; height: 24px; stroke: var(--ic); }

    /* Step 2 */
    .picked { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 12px 9px 9px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--field); }
    .picked:hover { border-color: var(--ic); }
    .picked small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
    .picked b { display: block; font-weight: 650; font-size: 15.5px; line-height: 1.25; }
    .picked .txt { flex: 1; min-width: 0; }
    .picked em { font-style: normal; font-size: 13.5px; font-weight: 600; color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 38px; padding: 7px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--field); font-size: 14.5px; line-height: 1.2; transition: border-color .15s ease, background-color .15s ease; }
    .chip:hover { border-color: var(--accent); }
    .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
    .chip--urgent { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; }
    .chip--urgent svg { width: 18px; height: 18px; stroke: currentColor; }
    .chip--urgent[aria-pressed="true"] { border-color: var(--warm); background: var(--warm-soft); color: var(--warm); }

    .group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .pair { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .label { font-size: 14px; font-weight: 600; }
    .label span { font-weight: 400; color: var(--muted); }

    /* 16px text keeps iOS Safari from zooming into a focused field. */
    input[type="text"], input[type="tel"], textarea { width: 100%; background: var(--field); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; transition: border-color .15s ease, background-color .15s ease; }
    textarea { min-height: 72px; resize: vertical; display: block; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--card); }
    [aria-invalid="true"] { border-color: var(--danger) !important; }

    .phone { display: flex; align-items: stretch; }
    .phone span { display: grid; place-items: center; padding: 0 13px; border: 1.5px solid var(--line); border-right: 0; border-radius: 14px 0 0 14px; background: var(--field); color: var(--muted); font-weight: 600; }
    .phone input { border-radius: 0 14px 14px 0; }

    /* Photos */
    .photos { display: flex; flex-wrap: wrap; gap: 10px; }
    .add { position: relative; display: flex; align-items: center; gap: 12px; flex: 1 1 220px; min-height: 72px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--muted); background: transparent; cursor: pointer; transition: border-color .15s ease, background-color .15s ease; }
    .add:hover { border-color: var(--accent); background: var(--accent-soft); }
    .add input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .add .badge { background: var(--accent-soft); }
    .add .badge svg { stroke: var(--accent); }
    .add b { display: block; font-weight: 650; font-size: 15px; line-height: 1.25; }
    .add small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
    .add--more { flex: 0 0 66px; width: 66px; min-height: 66px; justify-content: center; padding: 0; }
    .thumb { position: relative; width: 66px; height: 66px; flex: none; border-radius: 14px; overflow: hidden; background: var(--field); border: 1px solid var(--line); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(20, 26, 23, .72); color: #fff; display: grid; place-items: center; padding: 0; }
    .thumb button svg { width: 14px; height: 14px; stroke: #fff; }
    .note { color: var(--muted); font-size: 13px; margin: 0; }

    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
    .consent input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
    .consent a { color: var(--accent); }

    .err { color: var(--danger); font-size: 14px; font-weight: 600; margin: 0; }
    .banner { background: var(--warm-soft); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; margin: 0; }

    .btn { appearance: none; border: 0; border-radius: 16px; min-height: 56px; padding: 14px 20px; font-weight: 650; font-size: 16.5px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .primary { width: 100%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 24px rgba(31, 107, 84, .28); transition: transform .15s ease, filter .15s ease; }
    .primary:hover:not([disabled]) { filter: brightness(1.06); transform: translateY(-1px); }
    .ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }

    .done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 8px 0 4px; }
    .done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
    .done .ok svg { width: 36px; height: 36px; stroke: var(--accent); }
    .done .num { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); font-weight: 700; }
    .done p { margin: 0; color: var(--muted); max-width: 34ch; }

    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 12px; }

    @media (min-width: 520px) {
      body { padding-top: 36px; }
      .card { padding: 26px 26px 26px; }
      h1 { font-size: 30px; }
      .pair { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 340px) {
      .grid { grid-template-columns: 1fr; }
      .tile { min-height: 0; flex-direction: row; align-items: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .step { animation: none; }
      .tile, .primary, .chip { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M12 17c-1.6 0-2.5-1.1-2.5-2.4 0-1.6 1.6-2.4 2.5-4.1.9 1.7 2.5 2.5 2.5 4.1 0 1.3-.9 2.4-2.5 2.4z"/></svg>
      </div>
      <div>
        <div class="brand">Свиб-Дом Сервис</div>
        <div class="tag">Честный сервис для вашего дома · Калининград и область</div>
      </div>
    </header>

    <main class="card" id="card" aria-live="polite">
      <p class="hint">Загружаем форму…</p>
    </main>

    <footer>Мастер перезвонит, уточнит детали и назовёт цену до начала работ.</footer>
  </div>

  <script>
    (function() {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var API_ORIGIN = /^https?:$/i.test(window.location.protocol) ? window.location.origin : 'https://master.svib-dom-service.ru';
      var TOTAL = 2;
      var SOURCE_TOKEN = params.get('request_source_token') || params.get('t') || '';
      // One draft per request source: every client link is served from this
      // origin, so a shared key would carry one customer's answers into
      // another partner's link.
      var DRAFT_KEY = 'dom-servis-client-request-draft:' + SOURCE_TOKEN;

      // The server takes up to five images of 10 MB each (FormController).
      var MAX_PHOTOS = 5;
      var MAX_PHOTO_BYTES = 10 * 1024 * 1024;
      // Phone photos are several megabytes; a 1600px JPEG shows the
      // breakdown just as well and uploads fast on a mobile network.
      var MAX_PHOTO_SIDE = 1600;

      var ICON = {
        boiler: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="15" rx="2"/><path d="M9 21v-3M15 21v-3"/><path d="M12 14c-1.4 0-2.2-.9-2.2-2 0-1.4 1.4-2 2.2-3.5.8 1.5 2.2 2.1 2.2 3.5 0 1.1-.8 2-2.2 2z"/></svg>',
        heater: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="17" rx="6"/><path d="M10 22v-2.5M14 22v-2.5M12 8v5"/></svg>',
        pipe: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h9a3 3 0 0 1 3 3v3"/><path d="M3 11h7a1 1 0 0 1 1 1v1"/><path d="M13 13h4v2h-4z"/><path d="M15 18.5c0 1-.7 1.7-1.5 1.7S12 19.5 12 18.5c0-.9 1.5-2.5 1.5-2.5s1.5 1.6 1.5 2.5z"/></svg>',
        bolt: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13.5h6L10 22l8-11.5h-6z"/></svg>',
        wash: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M7 6h2"/></svg>',
        tool: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/></svg>',
        camera: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        close: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
        clock: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
      };

      // model: the master needs the brand and model (spare parts), so the
      // step asks for it; ask/issues word the question for the service.
      var CATS = [
        { id: 'boiler', name: 'Газовый котёл', hint: 'Не греет, ошибка, обслуживание', icon: 'boiler', color: '#d9622b',
          issues: ['Не греет отопление', 'Нет горячей воды', 'Ошибка на дисплее', 'Не включается', 'Течёт или капает', 'Шумит, хлопает', 'Падает давление', 'Плановое обслуживание'],
          model: 'Марка и модель котла', modelHint: 'Например: Baxi Eco Four 24', details: 'Например: ошибка E10, давление 0,5 бар' },
        { id: 'heater', name: 'Бойлер, колонка', hint: 'Нет горячей воды, течёт', icon: 'heater', color: '#0f8a8a',
          issues: ['Не греет воду', 'Течёт', 'Не зажигается колонка', 'Выбивает автомат', 'Чистка от накипи', 'Установка или замена'],
          model: 'Марка и модель', modelHint: 'Например: Ariston ABS 80', details: 'Например: греет час и отключается' },
        { id: 'plumb', name: 'Сантехника', hint: 'Протечка, засор, смеситель', icon: 'pipe', color: '#2f6fd0',
          issues: ['Протечка', 'Засор', 'Кран или смеситель', 'Унитаз', 'Радиатор отопления', 'Установка или замена'],
          details: 'Например: течёт под раковиной на кухне' },
        { id: 'electric', name: 'Электрика', hint: 'Розетки, автоматы, свет', icon: 'bolt', color: '#c98a00',
          issues: ['Нет света', 'Выбивает автомат', 'Розетка или выключатель', 'Подключить прибор', 'Люстра или светильник'],
          details: 'Например: выбивает автомат, когда включаю чайник' },
        { id: 'appliance', name: 'Бытовая техника', hint: 'Стиральная, холодильник, плита', icon: 'wash', color: '#7a55c7',
          ask: 'Какая техника?',
          issues: ['Стиральная машина', 'Посудомоечная машина', 'Холодильник', 'Плита, варочная панель', 'Духовой шкаф', 'Микроволновка', 'Другая техника'],
          model: 'Марка и модель техники', modelHint: 'Например: Bosch WAN 24260', details: 'Например: не сливает воду, ошибка E18' },
        { id: 'other', name: 'Другое по дому', hint: 'Мелкий ремонт, сборка, замки', icon: 'tool', color: '#2f7a5f',
          ask: 'Что нужно сделать?',
          issues: ['Мелкий ремонт', 'Повесить или собрать', 'Двери, замки', 'Окна', 'Нужна консультация'],
          details: 'Например: повесить телевизор на стену' }
      ];

      function emptyState() {
        return { step: 1, cat: null, issues: [], model: '', details: '', address: '', urgent: false, name: '', phone: '', consent: false };
      }

      var S = emptyState();
      // Photos live outside the saved draft: blobs do not belong in localStorage.
      var photos = [];
      var app = {
        token: SOURCE_TOKEN,
        fingerprint: ensureFingerprint(),
        config: null,
        submitting: false,
        photoBusy: false,
        photoNote: '',
        ticketNumber: '',
        fatal: ''
      };

      try {
        var draft = JSON.parse(window.localStorage.getItem(DRAFT_KEY) || 'null');
        if (draft && draft.step && draft.step <= TOTAL) S = Object.assign(S, draft);
        if (!cat()) { S.step = 1; S.cat = null; }
      } catch (e) { /* draft is a convenience only */ }

      var card = document.getElementById('card');

      function save() {
        try { window.localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
      }

      function clearDraft() {
        try { window.localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
      }

      function ensureFingerprint() {
        var key = 'dom-servis-client-fingerprint';
        try {
          var existing = window.localStorage.getItem(key);
          if (existing && existing.length > 30) return existing;
        } catch (e) { /* fall through */ }

        var bytes = new Uint8Array(32);
        window.crypto.getRandomValues(bytes);
        var value = Array.prototype.map.call(bytes, function(b) { return b.toString(16).padStart(2, '0'); }).join('') + Date.now().toString(16);
        try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
        return value;
      }

      function esc(value) {
        return String(value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function cat() {
        return CATS.find(function(c) { return c.id === S.cat; });
      }

      function normalizePhone(raw) {
        var digits = String(raw || '').replace(/\D/g, '');
        if (digits.length === 11 && (digits[0] === '8' || digits[0] === '7')) digits = digits.slice(1);
        return digits.slice(0, 10);
      }

      function formatPhone(raw) {
        var d = normalizePhone(raw);
        if (!d) return '';
        if (d.length <= 3) return '(' + d;
        if (d.length <= 6) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
        if (d.length <= 8) return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
        return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8, 10);
      }

      function localDate() {
        var date = new Date();
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
      }

      function weekdayKey(dateValue) {
        var date = new Date(dateValue + 'T00:00:00');
        return ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][date.getDay()] || 'mon';
      }

      function stepsMarkup() {
        return '<div class="steps"><span>Шаг ' + S.step + ' из ' + TOTAL + '</span>' +
          '<i class="on"></i><i' + (S.step > 1 ? ' class="on"' : '') + '></i></div>';
      }

      function chips(list, selected) {
        return '<div class="chips">' + list.map(function(value) {
          return '<button type="button" class="chip" data-issue="' + esc(value) + '" aria-pressed="' + (selected.indexOf(value) !== -1) + '">' + esc(value) + '</button>';
        }).join('') + '</div>';
      }

      function photosMarkup() {
        var full = photos.length >= MAX_PHOTOS;
        var input = '<input type="file" id="photoInput" accept="image/*" multiple aria-label="Добавить фото поломки">';
        var add = '';

        if (!photos.length) {
          add = '<label class="add"><span class="badge">' + ICON.camera + '</span>' +
            '<span><b>' + (app.photoBusy ? 'Готовим фото…' : 'Добавить фото поломки') + '</b>' +
            '<small>До ' + MAX_PHOTOS + ' снимков — мастер заранее поймёт, что взять с собой</small></span>' + input + '</label>';
        } else if (!full) {
          add = '<label class="add add--more" title="Добавить ещё фото"><span class="badge">' + ICON.plus + '</span>' + input + '</label>';
        }

        return '<div class="photos">' + photos.map(function(photo, index) {
          return '<div class="thumb"><img src="' + esc(photo.url) + '" alt="Фото ' + (index + 1) + '">' +
            '<button type="button" data-delphoto="' + index + '" aria-label="Убрать фото ' + (index + 1) + '">' + ICON.close + '</button></div>';
        }).join('') + add + '</div>' +
          (app.photoNote ? '<p class="note" role="status">' + esc(app.photoNote) + '</p>' : '');
      }

      function renderPhotos() {
        var box = document.getElementById('photoBox');
        if (box) box.innerHTML = photosMarkup();
      }

      function consentMarkup() {
        var policy = app.config && app.config.request_source && app.config.request_source.privacy_policy_url;
        var text = policy
          ? 'Согласен с <a href="' + esc(policy) + '" target="_blank" rel="noopener noreferrer">политикой конфиденциальности</a> и обработкой персональных данных'
          : 'Согласен на обработку персональных данных для связи по заявке';
        return '<label class="consent"><input type="checkbox" id="consent"' + (S.consent ? ' checked' : '') + '><span>' + text + '</span></label>';
      }

      function render() {
        if (app.fatal) {
          card.innerHTML = '<div class="step"><h1>Форма временно недоступна</h1><p class="banner">' + esc(app.fatal) + '</p></div>';
          return;
        }

        if (S.step <= TOTAL) save();
        var h = '';

        if (S.step === 1) {
          h = stepsMarkup() +
            '<h1>С чем помочь?</h1><p class="hint">Выберите услугу — останется оставить телефон.</p>' +
            '<div class="grid">' + CATS.map(function(c) {
              return '<button type="button" class="tile" style="--ic:' + c.color + '" data-cat="' + c.id + '" aria-pressed="' + (S.cat === c.id) + '">' +
                '<span class="badge">' + ICON[c.icon] + '</span>' +
                '<span><b>' + esc(c.name) + '</b><small>' + esc(c.hint) + '</small></span></button>';
            }).join('') + '</div>';
        } else if (S.step === 2) {
          var c = cat();
          h = stepsMarkup() +
            '<button type="button" class="picked" style="--ic:' + c.color + '" data-act="back">' +
            '<span class="badge">' + ICON[c.icon] + '</span><span class="txt"><small>Услуга</small><b>' + esc(c.name) + '</b></span><em>Изменить</em></button>' +
            '<h1>' + esc(c.ask || 'Что случилось?') + '</h1>' +
            chips(c.issues, S.issues) +
            '<div class="group"><label class="label" for="details">Опишите проблему <span>— своими словами</span></label>' +
            '<textarea id="details" maxlength="1000" placeholder="' + esc(c.details) + '">' + esc(S.details) + '</textarea></div>' +
            (c.model ? '<div class="group"><label class="label" for="model">' + esc(c.model) + ' <span>— если знаете</span></label>' +
              '<input id="model" type="text" maxlength="120" autocomplete="off" placeholder="' + esc(c.modelHint) + '" value="' + esc(S.model) + '"></div>' : '') +
            '<div id="photoBox">' + photosMarkup() + '</div>' +
            '<h2>Как с вами связаться</h2>' +
            '<div class="pair">' +
            '<div class="group"><label class="label" for="name">Имя</label>' +
            '<input id="name" type="text" maxlength="100" autocomplete="given-name" placeholder="Как к вам обращаться" value="' + esc(S.name) + '"></div>' +
            '<div class="group"><label class="label" for="phone">Телефон</label>' +
            '<div class="phone"><span>+7</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(900) 000-00-00" value="' + esc(formatPhone(S.phone)) + '"></div></div>' +
            '</div>' +
            '<div class="group"><label class="label" for="address">Адрес <span>— можно уточнить по телефону</span></label>' +
            '<input id="address" type="text" maxlength="300" autocomplete="street-address" placeholder="Город, улица, дом, квартира" value="' + esc(S.address) + '"></div>' +
            '<button type="button" class="chip chip--urgent" data-act="urgent" aria-pressed="' + S.urgent + '">' + ICON.clock + 'Срочно — нужен мастер сегодня</button>' +
            consentMarkup() +
            '<p class="err" id="err" role="alert" hidden></p>' +
            '<button class="btn primary" type="button" data-act="send" id="send"' + (app.submitting ? ' disabled' : '') + '>' + sendLabel() + '</button>';
        } else {
          h = '<div class="done"><div class="ok">' + ICON.check + '</div>' +
            '<h1>Заявка принята</h1>' +
            (app.ticketNumber ? '<div class="num">№ ' + esc(app.ticketNumber) + '</div>' : '') +
            '<p>Мастер перезвонит вам в рабочее время, уточнит детали и назовёт стоимость до начала работ.</p>' +
            '<button class="btn ghost" type="button" data-act="reset">Оставить ещё одну заявку</button></div>';
        }

        card.innerHTML = '<div class="step">' + h + '</div>';
      }

      function sendLabel() {
        if (!app.submitting) return 'Отправить заявку';
        return photos.length ? 'Отправляем фото…' : 'Отправляем…';
      }

      function fail(message, fieldId) {
        var el = document.getElementById('err');
        if (el) { el.textContent = message; el.hidden = false; }
        var field = fieldId && document.getElementById(fieldId);
        if (field) {
          field.setAttribute('aria-invalid', 'true');
          field.focus();
        }
      }

      function readFields() {
        ['details', 'model', 'address', 'name'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) S[id] = el.value;
        });
        var phone = document.getElementById('phone');
        if (phone) S.phone = normalizePhone(phone.value);
        var consent = document.getElementById('consent');
        if (consent) S.consent = consent.checked;
      }

      // Shown as the card title on the dispatch board, so the model goes here too.
      function serviceType() {
        var c = cat();
        var text = c.name + (S.issues.length ? ': ' + S.issues.join(', ') : '');
        var model = c.model ? S.model.trim() : '';
        return model ? text + ' · ' + model : text;
      }

      function descriptionText(phoneText) {
        var c = cat();
        var lines = ['Заявка клиента через форму по ссылке.', 'Что: ' + c.name + (S.issues.length ? ': ' + S.issues.join(', ') : '')];
        if (c.model && S.model.trim()) lines.push('Марка и модель: ' + S.model.trim());
        if (S.details.trim()) lines.push('Подробнее: ' + S.details.trim());
        lines.push('Адрес: ' + (S.address.trim() || 'не указан, уточнить у клиента'));
        if (S.urgent) lines.push('Срочно: нужен мастер сегодня');
        if (photos.length) lines.push('Фото от клиента: ' + photos.length);
        lines.push('Имя: ' + S.name.trim());
        lines.push('Телефон: ' + phoneText);
        return lines.join('\n');
      }

      // --- photos ---------------------------------------------------------

      function shrinkPhoto(file) {
        return new Promise(function(resolve, reject) {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function() {
            var scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
            var canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            var ctx = canvas.getContext('2d');
            // JPEG has no transparency: a white sheet under a screenshot.
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            canvas.toBlob(function(blob) {
              // Keep the original when the copy is not smaller (small or already compressed file).
              resolve(blob && blob.size < file.size ? blob : file);
            }, 'image/jpeg', 0.82);
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
            reject(new Error('decode'));
          };
          img.src = url;
        });
      }

      function preparePhoto(file) {
        if (!/^image\//.test(file.type || '')) return Promise.resolve(null);

        // A format the browser cannot draw (some HEIC files) goes as it is.
        return shrinkPhoto(file).catch(function() { return file; }).then(function(blob) {
          if (blob.size > MAX_PHOTO_BYTES) return null;
          var baseName = String(file.name || 'photo').replace(/\.[^.]+$/, '') || 'photo';
          var name = blob === file ? (file.name || 'photo.jpg') : baseName + '.jpg';
          return { blob: blob, name: name, url: URL.createObjectURL(blob) };
        });
      }

      function addPhotos(fileList) {
        var files = Array.prototype.slice.call(fileList || []);
        var room = MAX_PHOTOS - photos.length;
        var skipped = 0;
        app.photoNote = '';

        if (files.length > room) {
          app.photoNote = 'Можно приложить до ' + MAX_PHOTOS + ' фото — лишние не добавлены.';
          files = files.slice(0, Math.max(0, room));
        }
        if (!files.length) { renderPhotos(); return Promise.resolve(); }

        app.photoBusy = true;
        renderPhotos();

        return files.reduce(function(chain, file) {
          return chain.then(function() { return preparePhoto(file); }).then(function(photo) {
            if (photo) photos.push(photo); else skipped += 1;
          });
        }, Promise.resolve()).then(function() {
          app.photoBusy = false;
          if (skipped) app.photoNote = (skipped === 1 ? 'Один файл не добавлен' : 'Часть файлов не добавлена') + ': подходят только фото до 10 МБ.';
          renderPhotos();
        });
      }

      function removePhoto(index) {
        var removed = photos.splice(index, 1)[0];
        if (removed) URL.revokeObjectURL(removed.url);
        app.photoNote = '';
        renderPhotos();
      }

      function dropPhotos() {
        photos.forEach(function(photo) { URL.revokeObjectURL(photo.url); });
        photos = [];
        app.photoNote = '';
      }

      // --- submit ---------------------------------------------------------

      async function submit() {
        if (app.submitting) return;

        var phoneText = '+7 ' + formatPhone(S.phone);
        var visitDate = localDate();
        var description = descriptionText(phoneText);
        var comment = [
          S.urgent ? 'Клиент просит мастера сегодня.' : '',
          photos.length ? 'Клиент приложил фото: ' + photos.length + ' (во вложениях заявки).' : '',
          S.address.trim() ? '' : 'Адрес уточнить у клиента.',
          'Время визита согласовать с клиентом.'
        ].filter(Boolean).join(' ');

        var payload = new FormData();
        payload.set('fingerprint', app.fingerprint);
        payload.set('token', app.config.token || '');
        payload.set('request_source_token', app.token);
        payload.set('request_source_origin', window.location.origin);
        payload.set('name', S.name.trim());
        payload.set('title', serviceType().slice(0, 200));
        payload.set('body', description);
        payload.set('dom_servis_client_name', S.name.trim());
        payload.set('dom_servis_client_phone', phoneText);
        payload.set('dom_servis_service_type', serviceType().slice(0, 250));
        // The dispatch intake requires an address, so an empty one becomes a call-back reminder.
        payload.set('dom_servis_address', S.address.trim() || 'Уточнить у клиента');
        payload.set('dom_servis_visit_date', visitDate);
        payload.set('dom_servis_visit_day', weekdayKey(visitDate));
        payload.set('dom_servis_visit_time', 'Уточнить у клиента');
        payload.set('dom_servis_dispatch_priority', S.urgent ? 'high' : 'medium');
        payload.set('dom_servis_description', description);
        payload.set('dom_servis_comment', comment);
        photos.forEach(function(photo) {
          payload.append('file[]', photo.blob, photo.name);
        });

        app.submitting = true;
        setSending();

        try {
          var response = await fetch(app.config.endpoint || API_ORIGIN + '/api/v1/form_submit', {
            method: 'POST',
            body: payload,
            credentials: 'same-origin'
          });
          var data = await response.json().catch(function() { return {}; });

          if (!response.ok || data.errors) {
            app.submitting = false;
            setSending();
            fail(serverError(data.errors, response.status));
            return;
          }

          app.ticketNumber = data.ticket && data.ticket.number ? data.ticket.number : '';
          app.submitting = false;
          S.step = TOTAL + 1;
          clearDraft();
          dropPhotos();
          render();
        } catch (error) {
          app.submitting = false;
          setSending();
          fail('Не удалось отправить заявку. Проверьте интернет и попробуйте ещё раз.');
        }
      }

      // The button changes without a full render, so typed text and focus stay.
      function setSending() {
        var button = document.getElementById('send');
        if (!button) return;
        button.disabled = app.submitting;
        button.textContent = sendLabel();
      }

      function serverError(errors, status) {
        if (status === 413) return 'Фото получились слишком большими. Уберите часть снимков и отправьте ещё раз.';
        if (!errors) return 'Не удалось отправить заявку. Попробуйте ещё раз через минуту.';
        if (errors.file) return 'Не получилось принять фото: приложите до ' + MAX_PHOTOS + ' снимков, каждый до 10 МБ, или отправьте заявку без фото.';
        if (errors.name) return 'Проверьте имя.';
        if (errors.base) return 'Не удалось отправить заявку: ' + errors.base;
        return 'Не удалось отправить заявку. Проверьте поля и попробуйте ещё раз.';
      }

      card.addEventListener('change', function(event) {
        var target = event.target;
        if (target.id === 'photoInput') {
          addPhotos(target.files);
          target.value = '';
        }
      });

      card.addEventListener('input', function(event) {
        var target = event.target;
        if (target.id === 'photoInput') return;

        var err = document.getElementById('err');
        if (err) err.hidden = true;
        target.removeAttribute('aria-invalid');

        if (target.id === 'phone') {
          target.value = formatPhone(target.value);
          S.phone = normalizePhone(target.value);
        } else if (target.id === 'consent') {
          S.consent = target.checked;
        } else if (target.id) {
          S[target.id] = target.value;
        }
        save();
      });

      card.addEventListener('click', function(event) {
        var b = event.target.closest('button');
        if (!b) return;

        if (b.dataset.cat) {
          if (S.cat !== b.dataset.cat) { S.issues = []; S.model = ''; }
          S.cat = b.dataset.cat;
          S.step = 2;
          render();
          window.scrollTo(0, 0);
          return;
        }

        if (b.dataset.issue) {
          var value = b.dataset.issue;
          var idx = S.issues.indexOf(value);
          if (idx === -1) S.issues.push(value); else S.issues.splice(idx, 1);
          b.setAttribute('aria-pressed', String(idx === -1));
          save();
          return;
        }

        if (b.dataset.delphoto) {
          removePhoto(Number(b.dataset.delphoto));
          return;
        }

        var act = b.dataset.act;
        if (act === 'back') { readFields(); S.step = 1; render(); window.scrollTo(0, 0); }
        if (act === 'reset') { S = emptyState(); app.ticketNumber = ''; render(); window.scrollTo(0, 0); }
        if (act === 'urgent') {
          S.urgent = !S.urgent;
          b.setAttribute('aria-pressed', String(S.urgent));
          save();
        }
        if (act === 'send') {
          readFields();
          if (app.photoBusy) return fail('Подождите пару секунд — готовим фото.');
          if (!S.name.trim()) return fail('Напишите, как к вам обращаться.', 'name');
          if (normalizePhone(S.phone).length < 10) return fail('Проверьте номер телефона: нужно 10 цифр после +7.', 'phone');
          if (!S.consent) return fail('Подтвердите согласие на обработку данных, чтобы мы могли перезвонить.', 'consent');
          submit();
        }
      });

      async function bootstrap() {
        if (!app.token) {
          app.fatal = 'В ссылке не хватает кода формы. Попросите у нас актуальную ссылку.';
          render();
          return;
        }

        try {
          var body = new URLSearchParams();
          body.set('fingerprint', app.fingerprint);
          body.set('request_source_token', app.token);
          body.set('request_source_origin', window.location.origin);

          var response = await fetch(API_ORIGIN + '/api/v1/form_config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8', 'Accept': 'application/json' },
            body: body.toString(),
            credentials: 'same-origin'
          });
          var data = await response.json().catch(function() { return {}; });

          if (!response.ok) throw new Error('Ссылка на форму устарела или отключена. Попросите у нас актуальную ссылку.');
          if (!data.enabled) throw new Error('Приём заявок через форму сейчас приостановлен. Попробуйте позже.');

          app.config = data;
          render();
        } catch (error) {
          app.fatal = error.message || 'Не удалось загрузить форму. Обновите страницу.';
          render();
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
