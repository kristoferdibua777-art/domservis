<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0052cc">
  <!-- The page has its own dark variant: without it a browser or an in-app
       webview may darken the page by itself and recolor the logo. -->
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="description" content="Заявка мастеру СВИБ Дом Сервис: котлы, бойлеры, сантехника, электрика, бытовая техника. Калининград и Гурьевск.">
  <title>СВИБ Дом Сервис | Заявка на ремонт</title>
  <link rel="icon" href="svib/SVIB_favicon.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="svib/favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="svib/apple-touch-icon-180.png?v=1">
  <style>
    /* Standalone client request page in two steps: pick a service, then say
       what happened and how to reach you (photos welcome). Submits through
       the same Zammad form channel as the partner embed
       (form_config -> form_submit with request_source_token).

       Look: СВИБ Дом Сервис brand book v1.0. Brand files live in svib/
       (nginx caches /assets/ for years, so bump ?v= when one changes). */

    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400; font-display: swap; src: url('svib/fonts/montserrat-400.woff2?v=1') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 500; font-display: swap; src: url('svib/fonts/montserrat-500.woff2?v=1') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 600; font-display: swap; src: url('svib/fonts/montserrat-600.woff2?v=1') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 700; font-display: swap; src: url('svib/fonts/montserrat-700.woff2?v=1') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 800; font-display: swap; src: url('svib/fonts/montserrat-800.woff2?v=1') format('woff2'); }

    :root {
      /* Brand palette (brand book, section 6). Red is an accent only:
         the call to action, the urgent mark, errors. */
      --blue: #0052cc;
      --blue-hover: #0046ad;
      --blue-soft: #e6eefa;
      --red: #e30613;
      --red-hover: #c10510;
      --red-soft: #fdecee;
      --navy: #0b2f6b;
      --grey: #eef2f7;
      --line: #c9d2de;
      /* Field borders need 3:1 against white (WCAG 1.4.11); tech grey is 1.5:1. */
      --field-line: #8592a6;
      --slate: #5b6678;
      --ink: #1c2533;
      --white: #ffffff;
      --page: var(--grey);
      --radius: 8px;
      --shadow: 0 1px 2px rgba(11, 47, 107, .06), 0 12px 32px rgba(11, 47, 107, .09);
      --font: 'Montserrat', 'Arial', sans-serif;
      color-scheme: light dark;
    }

    /* Dark mode keeps the form itself on white: only the page around it goes navy. */
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #081f47;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font: 400 16px/1.45 var(--font);
      padding: 0 0 max(28px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Header: blue plate, white logo with the red roof (brand book, section 10). */
    .top { background: var(--blue); color: var(--white); padding-top: env(safe-area-inset-top); }
    .top__in { max-width: 1040px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .logo { display: block; width: 122px; height: 36px; flex: none; }
    .call { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px; color: var(--white); text-decoration: none; font-weight: 700; font-size: 15px; white-space: nowrap; border-radius: var(--radius); }
    .call img { width: 22px; height: 22px; flex: none; }
    .call small { display: none; }
    .top a:focus-visible { outline-color: var(--white); }

    .wrap { max-width: 560px; margin: 16px auto 0; padding: 0 12px; display: grid; gap: 16px; }

    .card { background: var(--white); color: var(--ink); color-scheme: light; border-radius: 12px; box-shadow: var(--shadow); padding: 20px 16px 22px; min-width: 0; }
    .step { display: flex; flex-direction: column; gap: 16px; animation: in .28s ease; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Accidence: Bold caps, 0.12em tracking. Bars lean at the roof's 30 degrees. */
    .steps { display: flex; align-items: center; gap: 10px; color: var(--slate); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .steps span { flex: none; margin-right: 4px; }
    .steps i { flex: 1; height: 6px; background: var(--line); transform: skewX(-30deg); }
    .steps i.on { background: var(--blue); }

    h1 { font-weight: 800; font-size: 26px; line-height: 1.15; letter-spacing: -.01em; color: var(--navy); margin: 2px 0 0; text-wrap: balance; }
    h2 { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); margin: 6px 0 -4px; display: flex; align-items: center; gap: 10px; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .hint { color: var(--slate); margin: -8px 0 0; font-size: 15px; }

    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    input[type="checkbox"]:focus-visible, .add:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }

    /* Step 1: services */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; min-height: 132px; padding: 12px 12px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--white); transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
    .tile:hover { border-color: var(--blue); box-shadow: 0 6px 18px rgba(0, 82, 204, .12); transform: translateY(-1px); }
    .tile:active { transform: scale(.985); }
    .tile[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
    .tile b { display: block; font-weight: 700; font-size: 15px; line-height: 1.2; color: var(--ink); }
    .tile small { display: block; margin-top: 4px; color: var(--slate); font-weight: 500; font-size: 12.5px; line-height: 1.3; }
    .badge { width: 48px; height: 48px; border-radius: var(--radius); display: grid; place-items: center; flex: none; background: var(--grey); }
    .badge img { width: 36px; height: 36px; display: block; }
    .badge svg { width: 24px; height: 24px; stroke: var(--blue); }

    /* Step 2 */
    .picked { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 12px 8px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--white); }
    .picked:hover { border-color: var(--blue); }
    .picked .badge { width: 44px; height: 44px; }
    .picked .badge img { width: 32px; height: 32px; }
    .picked small { display: block; color: var(--slate); font-weight: 500; font-size: 12px; line-height: 1.2; }
    .picked b { display: block; font-weight: 700; font-size: 15.5px; line-height: 1.25; }
    .picked .txt { flex: 1; min-width: 0; }
    .picked em { font-style: normal; font-size: 14px; font-weight: 600; color: var(--blue); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 40px; padding: 8px 13px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--white); font-size: 14.5px; font-weight: 500; line-height: 1.2; text-align: left; transition: border-color .15s ease, background-color .15s ease; }
    .chip:hover { border-color: var(--blue); }
    .chip[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 600; }
    .chip--urgent { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; min-height: 44px; }
    .chip--urgent svg { width: 20px; height: 20px; stroke: var(--slate); flex: none; }
    .chip--urgent:hover { border-color: var(--red); }
    .chip--urgent[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); color: var(--ink); }
    .chip--urgent[aria-pressed="true"] svg { stroke: var(--red); }

    .group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .pair { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .label { font-size: 14px; font-weight: 600; }
    .label span { font-weight: 400; color: var(--slate); }

    /* 16px text keeps iOS Safari from zooming into a focused field. */
    input[type="text"], input[type="tel"], textarea { width: 100%; background: var(--white); border: 1.5px solid var(--field-line); border-radius: var(--radius); padding: 13px 14px; font-size: 16px; transition: border-color .15s ease, box-shadow .15s ease; }
    textarea { min-height: 76px; resize: vertical; display: block; }
    input::placeholder, textarea::placeholder { color: var(--slate); opacity: 1; }
    input:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 82, 204, .2); }
    [aria-invalid="true"] { border-color: var(--red) !important; }
    input[type="checkbox"][aria-invalid="true"] { outline: 2px solid var(--red); outline-offset: 2px; }

    .phone { display: flex; align-items: stretch; }
    .phone span { display: grid; place-items: center; padding: 0 13px; border: 1.5px solid var(--field-line); border-right: 0; border-radius: var(--radius) 0 0 var(--radius); background: var(--grey); color: var(--ink); font-weight: 600; }
    .phone input { border-radius: 0 var(--radius) var(--radius) 0; }

    /* Photos */
    .photos { display: flex; flex-wrap: wrap; gap: 10px; }
    .add { position: relative; display: flex; align-items: center; gap: 12px; flex: 1 1 220px; min-height: 72px; padding: 12px 14px; border-radius: 10px; border: 1.5px dashed var(--blue); background: var(--grey); cursor: pointer; transition: background-color .15s ease; }
    .add:hover { background: var(--blue-soft); }
    .add input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .add .badge { background: var(--white); }
    .add b { display: block; font-weight: 700; font-size: 15px; line-height: 1.25; }
    .add small { display: block; color: var(--slate); font-weight: 500; font-size: 12.5px; line-height: 1.3; }
    .add--more { flex: 0 0 68px; width: 68px; min-height: 68px; justify-content: center; padding: 0; }
    .thumb { position: relative; width: 68px; height: 68px; flex: none; border-radius: var(--radius); overflow: hidden; background: var(--grey); border: 1px solid var(--line); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(28, 37, 51, .78); color: #fff; display: grid; place-items: center; padding: 0; }
    .thumb button svg { width: 14px; height: 14px; stroke: #fff; }
    .note { color: var(--slate); font-size: 13px; margin: 0; }

    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--slate); }
    .consent input { width: 22px; height: 22px; margin: 0; accent-color: var(--blue); flex: none; }
    .consent a { color: var(--blue); font-weight: 600; }

    .err { margin: 0; padding: 11px 14px; border-left: 4px solid var(--red); border-radius: var(--radius); background: var(--red-soft); color: var(--ink); font-size: 14.5px; font-weight: 600; }
    .err[hidden] { display: none; }
    .banner { margin: 0; padding: 12px 14px; border-left: 4px solid var(--red); border-radius: var(--radius); background: var(--grey); font-size: 15px; }

    /* Buttons: SemiBold 600 (brand book, section 7). Red is the call to action. */
    .btn { appearance: none; -webkit-appearance: none; border: 0; border-radius: var(--radius); min-height: 56px; padding: 14px 20px; font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .primary { width: 100%; background: var(--red); color: var(--white); box-shadow: 0 10px 22px rgba(227, 6, 19, .22); transition: background-color .15s ease, transform .15s ease; }
    .primary:hover:not([disabled]) { background: var(--red-hover); transform: translateY(-1px); }
    .ghost { background: var(--white); color: var(--blue); border: 1.5px solid var(--blue); }
    .ghost:hover { background: var(--blue-soft); }

    .done { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 8px 0 4px; }
    .done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; }
    .done .ok svg { width: 36px; height: 36px; stroke: var(--white); }
    .done .num { display: inline-block; padding: 7px 16px; border-radius: var(--radius); background: var(--grey); font-weight: 700; letter-spacing: .02em; }
    .done p { margin: 0; color: var(--slate); max-width: 34ch; }

    /* Contacts: navy plate with white icons (brand book, section 10). Two
       stripes, blue then red as in the sign, rise from the bottom edge at the
       roof's 30 degrees and leave through the right edge, clear of the text. */
    .info { position: relative; overflow: hidden; background: var(--navy); color: var(--white); border-radius: 12px; padding: 22px 18px; }
    .info > * { position: relative; z-index: 1; }
    .info::before, .info::after { content: ""; position: absolute; bottom: 0; height: 100%; transform: skewX(-30deg); transform-origin: bottom; }
    .info::before { right: 88px; width: 22px; background: var(--blue); }
    .info::after { right: 64px; width: 8px; background: var(--red); }
    .info__title { margin: 0; font-weight: 800; font-size: 20px; line-height: 1.2; text-wrap: balance; }
    .info__lead { margin: 8px 0 0; font-size: 15px; }
    .contacts { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
    .contacts li { display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 15px; line-height: 1.3; }
    .contacts img { width: 28px; height: 28px; flex: none; }
    .contacts a { color: var(--white); font-weight: 700; font-size: 17px; text-decoration: none; white-space: nowrap; min-height: 44px; display: inline-flex; align-items: center; border-radius: var(--radius); }
    .contacts a:focus-visible { outline-color: var(--white); }

    @media (prefers-color-scheme: dark) {
      .info { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }
    }

    @media (min-width: 520px) {
      .wrap { margin-top: 28px; }
      .card { padding: 28px; }
      h1 { font-size: 30px; }
      .pair { grid-template-columns: 1fr 1fr; }
      .info { padding: 26px; }
      .info::before { right: 100px; width: 26px; }
      .info::after { right: 72px; width: 10px; }
    }

    @media (min-width: 960px) {
      .top__in { padding-top: 14px; padding-bottom: 14px; }
      .logo { width: 149px; height: 44px; }
      .call { font-size: 17px; flex-direction: column; align-items: flex-end; gap: 0; line-height: 1.25; }
      .call img { display: none; }
      .call small { display: block; font-size: 13px; font-weight: 500; }
      .wrap { max-width: 1040px; margin-top: 40px; grid-template-columns: minmax(0, 1fr) 560px; grid-template-areas: "info card"; gap: 32px; align-items: start; }
      .card { grid-area: card; }
      .info { grid-area: info; position: sticky; top: 24px; padding: 40px 36px; min-height: 420px; }
      .info::before { right: 130px; width: 34px; }
      .info::after { right: 96px; width: 12px; }
      .info__title { font-size: 34px; }
      .info__lead { font-size: 17px; margin-top: 14px; }
      .contacts { margin-top: 32px; gap: 16px; }
    }

    @media (max-width: 359px) {
      .top__in { padding-left: 12px; padding-right: 12px; gap: 8px; }
      .logo { width: 108px; height: 32px; }
      .call { font-size: 14px; gap: 6px; }
      .call img { width: 18px; height: 18px; }
      .wrap { padding: 0 8px; }
      .card { padding: 18px 14px 20px; }
      .grid { grid-template-columns: 1fr; }
      .tile { min-height: 0; flex-direction: row; align-items: center; }
      .info::before { right: 72px; width: 18px; }
      .info::after { right: 52px; width: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .step { animation: none; }
      .tile, .primary, .chip { transition: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top__in">
      <img class="logo" src="svib/SVIB_logo_horizontal_noslogan_white.svg?v=1" width="122" height="36" alt="СВИБ Дом Сервис">
      <a class="call" href="tel:+79114856632">
        <img src="svib/icons/SVIB_icon_contact-phone_white.svg?v=1" width="22" height="22" alt="">
        <span>+7 911 485-66-32</span>
        <small>Звонки с 10:00 до 18:00</small>
      </a>
    </div>
  </header>

  <div class="wrap">
    <main class="card" id="card" aria-live="polite">
      <p class="hint">Загружаем форму…</p>
    </main>

    <aside class="info" aria-label="Контакты">
      <p class="info__title">Надёжный мастер&nbsp;— для вашего дома.</p>
      <p class="info__lead">Мастер перезвонит, уточнит детали и назовёт цену до начала работ.</p>
      <ul class="contacts">
        <li><img src="svib/icons/SVIB_icon_contact-phone_white.svg?v=1" width="28" height="28" alt=""><a href="tel:+79114856632">+7 911 485-66-32</a></li>
        <li><img src="svib/icons/SVIB_icon_contact-address_white.svg?v=1" width="28" height="28" alt=""><span>Калининград и Гурьевск</span></li>
        <li><img src="svib/icons/SVIB_icon_contact-hours_white.svg?v=1" width="28" height="28" alt=""><span>Звонки с 10:00 до 18:00</span></li>
      </ul>
    </aside>
  </div>

  <script>
    (function() {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var API_ORIGIN = /^https?:$/i.test(window.location.protocol) ? window.location.origin : 'https://master.svib-dom-service.ru';
      var TOTAL = 2;
      var SOURCE_TOKEN = params.get('request_source_token') || params.get('t') || '';
      // One draft per request source: every client link is served from this
      // origin, so a shared key would carry one customer's answers into
      // another partner's link.
      var DRAFT_KEY = 'dom-servis-client-request-draft:' + SOURCE_TOKEN;

      // The server takes up to five images of 10 MB each (FormController).
      var MAX_PHOTOS = 5;
      var MAX_PHOTO_BYTES = 10 * 1024 * 1024;
      // Phone photos are several megabytes; a 1600px JPEG shows the
      // breakdown just as well and uploads fast on a mobile network.
      var MAX_PHOTO_SIDE = 1600;

      var ICON = {
        camera: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        close: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
        clock: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
      };

      // Service icons from the brand book (svib/icons); bump ?v= with a new file.
      function serviceIcon(c) {
        return '<img src="svib/icons/SVIB_icon_' + c.icon + '_color.svg?v=1" width="36" height="36" alt="">';
      }

      // model: the master needs the brand and model (spare parts), so the
      // step asks for it; ask/issues word the question for the service.
      var CATS = [
        { id: 'boiler', name: 'Газовый котёл', hint: 'Не греет, ошибка, обслуживание', icon: 'heating',
          issues: ['Не греет отопление', 'Нет горячей воды', 'Ошибка на дисплее', 'Не включается', 'Течёт или капает', 'Шумит, хлопает', 'Падает давление', 'Плановое обслуживание'],
          model: 'Марка и модель котла', modelHint: 'Например: Baxi Eco Four 24', details: 'Например: ошибка E10, давление 0,5 бар' },
        { id: 'heater', name: 'Бойлер, колонка', hint: 'Нет горячей воды, течёт', icon: 'water-heater',
          issues: ['Не греет воду', 'Течёт', 'Не зажигается колонка', 'Выбивает автомат', 'Чистка от накипи', 'Установка или замена'],
          model: 'Марка и модель', modelHint: 'Например: Ariston ABS 80', details: 'Например: греет час и отключается' },
        { id: 'plumb', name: 'Сантехника', hint: 'Протечка, засор, смеситель', icon: 'plumbing',
          issues: ['Протечка', 'Засор', 'Кран или смеситель', 'Унитаз', 'Радиатор отопления', 'Установка или замена'],
          details: 'Например: течёт под раковиной на кухне' },
        { id: 'electric', name: 'Электрика', hint: 'Розетки, автоматы, свет', icon: 'electrics',
          issues: ['Нет света', 'Выбивает автомат', 'Розетка или выключатель', 'Подключить прибор', 'Люстра или светильник'],
          details: 'Например: выбивает автомат, когда включаю чайник' },
        { id: 'appliance', name: 'Бытовая техника', hint: 'Стиральная, холодильник, плита', icon: 'appliances',
          ask: 'Какая техника?',
          issues: ['Стиральная машина', 'Посудомоечная машина', 'Холодильник', 'Плита, варочная панель', 'Духовой шкаф', 'Микроволновка', 'Другая техника'],
          model: 'Марка и модель техники', modelHint: 'Например: Bosch WAN 24260', details: 'Например: не сливает воду, ошибка E18' },
        { id: 'other', name: 'Другое по дому', hint: 'Мелкий ремонт, сборка, замки', icon: 'home-repair',
          ask: 'Что нужно сделать?',
          issues: ['Мелкий ремонт', 'Повесить или собрать', 'Двери, замки', 'Окна', 'Нужна консультация'],
          details: 'Например: повесить телевизор на стену' }
      ];

      function emptyState() {
        return { step: 1, cat: null, issues: [], model: '', details: '', address: '', urgent: false, name: '', phone: '', consent: false };
      }

      var S = emptyState();
      // Photos live outside the saved draft: blobs do not belong in localStorage.
      var photos = [];
      var app = {
        token: SOURCE_TOKEN,
        fingerprint: ensureFingerprint(),
        config: null,
        submitting: false,
        photoBusy: false,
        photoNote: '',
        ticketNumber: '',
        fatal: ''
      };

      try {
        var draft = JSON.parse(window.localStorage.getItem(DRAFT_KEY) || 'null');
        if (draft && draft.step && draft.step <= TOTAL) S = Object.assign(S, draft);
        if (!cat()) { S.step = 1; S.cat = null; }
      } catch (e) { /* draft is a convenience only */ }

      var card = document.getElementById('card');

      function save() {
        try { window.localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
      }

      function clearDraft() {
        try { window.localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
      }

      function ensureFingerprint() {
        var key = 'dom-servis-client-fingerprint';
        try {
          var existing = window.localStorage.getItem(key);
          if (existing && existing.length > 30) return existing;
        } catch (e) { /* fall through */ }

        var bytes = new Uint8Array(32);
        window.crypto.getRandomValues(bytes);
        var value = Array.prototype.map.call(bytes, function(b) { return b.toString(16).padStart(2, '0'); }).join('') + Date.now().toString(16);
        try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
        return value;
      }

      function esc(value) {
        return String(value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function cat() {
        return CATS.find(function(c) { return c.id === S.cat; });
      }

      function normalizePhone(raw) {
        var digits = String(raw || '').replace(/\D/g, '');
        if (digits.length === 11 && (digits[0] === '8' || digits[0] === '7')) digits = digits.slice(1);
        return digits.slice(0, 10);
      }

      function formatPhone(raw) {
        var d = normalizePhone(raw);
        if (!d) return '';
        if (d.length <= 3) return '(' + d;
        if (d.length <= 6) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
        if (d.length <= 8) return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
        return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8, 10);
      }

      function localDate() {
        var date = new Date();
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
      }

      function weekdayKey(dateValue) {
        var date = new Date(dateValue + 'T00:00:00');
        return ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][date.getDay()] || 'mon';
      }

      function stepsMarkup() {
        return '<div class="steps"><span>Шаг ' + S.step + ' из ' + TOTAL + '</span>' +
          '<i class="on"></i><i' + (S.step > 1 ? ' class="on"' : '') + '></i></div>';
      }

      function chips(list, selected) {
        return '<div class="chips">' + list.map(function(value) {
          return '<button type="button" class="chip" data-issue="' + esc(value) + '" aria-pressed="' + (selected.indexOf(value) !== -1) + '">' + esc(value) + '</button>';
        }).join('') + '</div>';
      }

      function photosMarkup() {
        var full = photos.length >= MAX_PHOTOS;
        var input = '<input type="file" id="photoInput" accept="image/*" multiple aria-label="Добавить фото поломки">';
        var add = '';

        if (!photos.length) {
          add = '<label class="add"><span class="badge">' + ICON.camera + '</span>' +
            '<span><b>' + (app.photoBusy ? 'Готовим фото…' : 'Добавить фото поломки') + '</b>' +
            '<small>До ' + MAX_PHOTOS + ' снимков — мастер заранее поймёт, что взять с собой</small></span>' + input + '</label>';
        } else if (!full) {
          add = '<label class="add add--more" title="Добавить ещё фото"><span class="badge">' + ICON.plus + '</span>' + input + '</label>';
        }

        return '<div class="photos">' + photos.map(function(photo, index) {
          return '<div class="thumb"><img src="' + esc(photo.url) + '" alt="Фото ' + (index + 1) + '">' +
            '<button type="button" data-delphoto="' + index + '" aria-label="Убрать фото ' + (index + 1) + '">' + ICON.close + '</button></div>';
        }).join('') + add + '</div>' +
          (app.photoNote ? '<p class="note" role="status">' + esc(app.photoNote) + '</p>' : '');
      }

      function renderPhotos() {
        var box = document.getElementById('photoBox');
        if (box) box.innerHTML = photosMarkup();
      }

      function consentMarkup() {
        var policy = app.config && app.config.request_source && app.config.request_source.privacy_policy_url;
        var text = policy
          ? 'Согласен с <a href="' + esc(policy) + '" target="_blank" rel="noopener noreferrer">политикой конфиденциальности</a> и обработкой персональных данных'
          : 'Согласен на обработку персональных данных для связи по заявке';
        return '<label class="consent"><input type="checkbox" id="consent"' + (S.consent ? ' checked' : '') + '><span>' + text + '</span></label>';
      }

      function render() {
        if (app.fatal) {
          card.innerHTML = '<div class="step"><h1>Форма временно недоступна</h1><p class="banner">' + esc(app.fatal) + '</p></div>';
          return;
        }

        if (S.step <= TOTAL) save();
        var h = '';

        if (S.step === 1) {
          h = stepsMarkup() +
            '<h1>С чем помочь?</h1><p class="hint">Выберите услугу — останется оставить телефон.</p>' +
            '<div class="grid">' + CATS.map(function(c) {
              return '<button type="button" class="tile" data-cat="' + c.id + '" aria-pressed="' + (S.cat === c.id) + '">' +
                '<span class="badge">' + serviceIcon(c) + '</span>' +
                '<span><b>' + esc(c.name) + '</b><small>' + esc(c.hint) + '</small></span></button>';
            }).join('') + '</div>';
        } else if (S.step === 2) {
          var c = cat();
          h = stepsMarkup() +
            '<button type="button" class="picked" data-act="back">' +
            '<span class="badge">' + serviceIcon(c) + '</span><span class="txt"><small>Услуга</small><b>' + esc(c.name) + '</b></span><em>Изменить</em></button>' +
            '<h1>' + esc(c.ask || 'Что случилось?') + '</h1>' +
            chips(c.issues, S.issues) +
            '<div class="group"><label class="label" for="details">Опишите проблему <span>— своими словами</span></label>' +
            '<textarea id="details" maxlength="1000" placeholder="' + esc(c.details) + '">' + esc(S.details) + '</textarea></div>' +
            (c.model ? '<div class="group"><label class="label" for="model">' + esc(c.model) + ' <span>— если знаете</span></label>' +
              '<input id="model" type="text" maxlength="120" autocomplete="off" placeholder="' + esc(c.modelHint) + '" value="' + esc(S.model) + '"></div>' : '') +
            '<div id="photoBox">' + photosMarkup() + '</div>' +
            '<h2>Как с вами связаться</h2>' +
            '<div class="pair">' +
            '<div class="group"><label class="label" for="name">Имя</label>' +
            '<input id="name" type="text" maxlength="100" autocomplete="given-name" placeholder="Как к вам обращаться" value="' + esc(S.name) + '"></div>' +
            '<div class="group"><label class="label" for="phone">Телефон</label>' +
            '<div class="phone"><span>+7</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(900) 000-00-00" value="' + esc(formatPhone(S.phone)) + '"></div></div>' +
            '</div>' +
            '<div class="group"><label class="label" for="address">Адрес <span>— можно уточнить по телефону</span></label>' +
            '<input id="address" type="text" maxlength="300" autocomplete="street-address" placeholder="Город, улица, дом, квартира" value="' + esc(S.address) + '"></div>' +
            '<button type="button" class="chip chip--urgent" data-act="urgent" aria-pressed="' + S.urgent + '">' + ICON.clock + 'Срочно — нужен мастер сегодня</button>' +
            consentMarkup() +
            '<p class="err" id="err" role="alert" hidden></p>' +
            '<button class="btn primary" type="button" data-act="send" id="send"' + (app.submitting ? ' disabled' : '') + '>' + sendLabel() + '</button>';
        } else {
          h = '<div class="done"><div class="ok">' + ICON.check + '</div>' +
            '<h1>Заявка принята</h1>' +
            (app.ticketNumber ? '<div class="num">№ ' + esc(app.ticketNumber) + '</div>' : '') +
            '<p>Мастер перезвонит вам в рабочее время, уточнит детали и назовёт стоимость до начала работ.</p>' +
            '<button class="btn ghost" type="button" data-act="reset">Оставить ещё одну заявку</button></div>';
        }

        card.innerHTML = '<div class="step">' + h + '</div>';
      }

      function sendLabel() {
        if (!app.submitting) return 'Отправить заявку';
        return photos.length ? 'Отправляем фото…' : 'Отправляем…';
      }

      function fail(message, fieldId) {
        var el = document.getElementById('err');
        if (el) { el.textContent = message; el.hidden = false; }
        var field = fieldId && document.getElementById(fieldId);
        if (field) {
          field.setAttribute('aria-invalid', 'true');
          field.focus();
        }
      }

      function readFields() {
        ['details', 'model', 'address', 'name'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) S[id] = el.value;
        });
        var phone = document.getElementById('phone');
        if (phone) S.phone = normalizePhone(phone.value);
        var consent = document.getElementById('consent');
        if (consent) S.consent = consent.checked;
      }

      // Shown as the card title on the dispatch board, so the model goes here too.
      function serviceType() {
        var c = cat();
        var text = c.name + (S.issues.length ? ': ' + S.issues.join(', ') : '');
        var model = c.model ? S.model.trim() : '';
        return model ? text + ' · ' + model : text;
      }

      function descriptionText(phoneText) {
        var c = cat();
        var lines = ['Заявка клиента через форму по ссылке.', 'Что: ' + c.name + (S.issues.length ? ': ' + S.issues.join(', ') : '')];
        if (c.model && S.model.trim()) lines.push('Марка и модель: ' + S.model.trim());
        if (S.details.trim()) lines.push('Подробнее: ' + S.details.trim());
        lines.push('Адрес: ' + (S.address.trim() || 'не указан, уточнить у клиента'));
        if (S.urgent) lines.push('Срочно: нужен мастер сегодня');
        if (photos.length) lines.push('Фото от клиента: ' + photos.length);
        lines.push('Имя: ' + S.name.trim());
        lines.push('Телефон: ' + phoneText);
        return lines.join('\n');
      }

      // --- photos ---------------------------------------------------------

      function shrinkPhoto(file) {
        return new Promise(function(resolve, reject) {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function() {
            var scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
            var canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            var ctx = canvas.getContext('2d');
            // JPEG has no transparency: a white sheet under a screenshot.
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            canvas.toBlob(function(blob) {
              // Keep the original when the copy is not smaller (small or already compressed file).
              resolve(blob && blob.size < file.size ? blob : file);
            }, 'image/jpeg', 0.82);
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
            reject(new Error('decode'));
          };
          img.src = url;
        });
      }

      function preparePhoto(file) {
        if (!/^image\//.test(file.type || '')) return Promise.resolve(null);

        // A format the browser cannot draw (some HEIC files) goes as it is.
        return shrinkPhoto(file).catch(function() { return file; }).then(function(blob) {
          if (blob.size > MAX_PHOTO_BYTES) return null;
          var baseName = String(file.name || 'photo').replace(/\.[^.]+$/, '') || 'photo';
          var name = blob === file ? (file.name || 'photo.jpg') : baseName + '.jpg';
          return { blob: blob, name: name, url: URL.createObjectURL(blob) };
        });
      }

      function addPhotos(fileList) {
        var files = Array.prototype.slice.call(fileList || []);
        var room = MAX_PHOTOS - photos.length;
        var skipped = 0;
        app.photoNote = '';

        if (files.length > room) {
          app.photoNote = 'Можно приложить до ' + MAX_PHOTOS + ' фото — лишние не добавлены.';
          files = files.slice(0, Math.max(0, room));
        }
        if (!files.length) { renderPhotos(); return Promise.resolve(); }

        app.photoBusy = true;
        renderPhotos();

        return files.reduce(function(chain, file) {
          return chain.then(function() { return preparePhoto(file); }).then(function(photo) {
            if (photo) photos.push(photo); else skipped += 1;
          });
        }, Promise.resolve()).then(function() {
          app.photoBusy = false;
          if (skipped) app.photoNote = (skipped === 1 ? 'Один файл не добавлен' : 'Часть файлов не добавлена') + ': подходят только фото до 10 МБ.';
          renderPhotos();
        });
      }

      function removePhoto(index) {
        var removed = photos.splice(index, 1)[0];
        if (removed) URL.revokeObjectURL(removed.url);
        app.photoNote = '';
        renderPhotos();
      }

      function dropPhotos() {
        photos.forEach(function(photo) { URL.revokeObjectURL(photo.url); });
        photos = [];
        app.photoNote = '';
      }

      // --- submit ---------------------------------------------------------

      async function submit() {
        if (app.submitting) return;

        var phoneText = '+7 ' + formatPhone(S.phone);
        var visitDate = localDate();
        var description = descriptionText(phoneText);
        var comment = [
          S.urgent ? 'Клиент просит мастера сегодня.' : '',
          photos.length ? 'Клиент приложил фото: ' + photos.length + ' (во вложениях заявки).' : '',
          S.address.trim() ? '' : 'Адрес уточнить у клиента.',
          'Время визита согласовать с клиентом.'
        ].filter(Boolean).join(' ');

        var payload = new FormData();
        payload.set('fingerprint', app.fingerprint);
        payload.set('token', app.config.token || '');
        payload.set('request_source_token', app.token);
        payload.set('request_source_origin', window.location.origin);
        payload.set('name', S.name.trim());
        payload.set('title', serviceType().slice(0, 200));
        payload.set('body', description);
        payload.set('dom_servis_client_name', S.name.trim());
        payload.set('dom_servis_client_phone', phoneText);
        payload.set('dom_servis_service_type', serviceType().slice(0, 250));
        // The dispatch intake requires an address, so an empty one becomes a call-back reminder.
        payload.set('dom_servis_address', S.address.trim() || 'Уточнить у клиента');
        payload.set('dom_servis_visit_date', visitDate);
        payload.set('dom_servis_visit_day', weekdayKey(visitDate));
        payload.set('dom_servis_visit_time', 'Уточнить у клиента');
        payload.set('dom_servis_dispatch_priority', S.urgent ? 'high' : 'medium');
        payload.set('dom_servis_description', description);
        payload.set('dom_servis_comment', comment);
        photos.forEach(function(photo) {
          payload.append('file[]', photo.blob, photo.name);
        });

        app.submitting = true;
        setSending();

        try {
          var response = await fetch(app.config.endpoint || API_ORIGIN + '/api/v1/form_submit', {
            method: 'POST',
            body: payload,
            credentials: 'same-origin'
          });
          var data = await response.json().catch(function() { return {}; });

          if (!response.ok || data.errors) {
            app.submitting = false;
            setSending();
            fail(serverError(data.errors, response.status));
            return;
          }

          app.ticketNumber = data.ticket && data.ticket.number ? data.ticket.number : '';
          app.submitting = false;
          S.step = TOTAL + 1;
          clearDraft();
          dropPhotos();
          render();
        } catch (error) {
          app.submitting = false;
          setSending();
          fail('Не удалось отправить заявку. Проверьте интернет и попробуйте ещё раз.');
        }
      }

      // The button changes without a full render, so typed text and focus stay.
      function setSending() {
        var button = document.getElementById('send');
        if (!button) return;
        button.disabled = app.submitting;
        button.textContent = sendLabel();
      }

      function serverError(errors, status) {
        if (status === 413) return 'Фото получились слишком большими. Уберите часть снимков и отправьте ещё раз.';
        if (!errors) return 'Не удалось отправить заявку. Попробуйте ещё раз через минуту.';
        if (errors.file) return 'Не получилось принять фото: приложите до ' + MAX_PHOTOS + ' снимков, каждый до 10 МБ, или отправьте заявку без фото.';
        if (errors.name) return 'Проверьте имя.';
        if (errors.base) return 'Не удалось отправить заявку: ' + errors.base;
        return 'Не удалось отправить заявку. Проверьте поля и попробуйте ещё раз.';
      }

      card.addEventListener('change', function(event) {
        var target = event.target;
        if (target.id === 'photoInput') {
          addPhotos(target.files);
          target.value = '';
        }
      });

      card.addEventListener('input', function(event) {
        var target = event.target;
        if (target.id === 'photoInput') return;

        var err = document.getElementById('err');
        if (err) err.hidden = true;
        target.removeAttribute('aria-invalid');

        if (target.id === 'phone') {
          target.value = formatPhone(target.value);
          S.phone = normalizePhone(target.value);
        } else if (target.id === 'consent') {
          S.consent = target.checked;
        } else if (target.id) {
          S[target.id] = target.value;
        }
        save();
      });

      card.addEventListener('click', function(event) {
        var b = event.target.closest('button');
        if (!b) return;

        if (b.dataset.cat) {
          if (S.cat !== b.dataset.cat) { S.issues = []; S.model = ''; }
          S.cat = b.dataset.cat;
          S.step = 2;
          render();
          window.scrollTo(0, 0);
          return;
        }

        if (b.dataset.issue) {
          var value = b.dataset.issue;
          var idx = S.issues.indexOf(value);
          if (idx === -1) S.issues.push(value); else S.issues.splice(idx, 1);
          b.setAttribute('aria-pressed', String(idx === -1));
          save();
          return;
        }

        if (b.dataset.delphoto) {
          removePhoto(Number(b.dataset.delphoto));
          return;
        }

        var act = b.dataset.act;
        if (act === 'back') { readFields(); S.step = 1; render(); window.scrollTo(0, 0); }
        if (act === 'reset') { S = emptyState(); app.ticketNumber = ''; render(); window.scrollTo(0, 0); }
        if (act === 'urgent') {
          S.urgent = !S.urgent;
          b.setAttribute('aria-pressed', String(S.urgent));
          save();
        }
        if (act === 'send') {
          readFields();
          if (app.photoBusy) return fail('Подождите пару секунд — готовим фото.');
          if (!S.name.trim()) return fail('Напишите, как к вам обращаться.', 'name');
          if (normalizePhone(S.phone).length < 10) return fail('Проверьте номер телефона: нужно 10 цифр после +7.', 'phone');
          if (!S.consent) return fail('Подтвердите согласие на обработку данных, чтобы мы могли перезвонить.', 'consent');
          submit();
        }
      });

      async function bootstrap() {
        if (!app.token) {
          app.fatal = 'В ссылке не хватает кода формы. Попросите у нас актуальную ссылку.';
          render();
          return;
        }

        try {
          var body = new URLSearchParams();
          body.set('fingerprint', app.fingerprint);
          body.set('request_source_token', app.token);
          body.set('request_source_origin', window.location.origin);

          var response = await fetch(API_ORIGIN + '/api/v1/form_config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8', 'Accept': 'application/json' },
            body: body.toString(),
            credentials: 'same-origin'
          });
          var data = await response.json().catch(function() { return {}; });

          if (!response.ok) throw new Error('Ссылка на форму устарела или отключена. Попросите у нас актуальную ссылку.');
          if (!data.enabled) throw new Error('Приём заявок через форму сейчас приостановлен. Попробуйте позже.');

          app.config = data;
          render();
        } catch (error) {
          app.fatal = error.message || 'Не удалось загрузить форму. Обновите страницу.';
          render();
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
