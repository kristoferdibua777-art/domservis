name: update-gemfile-lock

# Manually triggered workflow that regenerates Gemfile.lock inside the
# zammad-ci container (which has Ruby + Bundler already installed) and
# commits the result back to the branch the run was started against.
#
# Use this after adding/removing a gem in Gemfile on a machine where
# Ruby/Bundler is not available (e.g. the Windows development host).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update Gemfile.lock on"
        required: true
        type: string
        default: "develop"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    container:
      image: zammad/zammad-ci:latest
      # Ensure the working directory is the checkout root, not the
      # container's default /opt/zammad, so git commands resolve .git.
      options: --user root
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Regenerate Gemfile.lock
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eo pipefail
          # NOTE: do NOT use `set -u` here — /etc/profile.d/rvm.sh
          # references unbound variables (rvm_path) on first load and
          # will abort under nounset.
          # shellcheck disable=SC1091
          source /etc/profile.d/rvm.sh

          ruby -v
          bundle -v
          pwd

          # Allow the lockfile to be mutated (zammad-ci ships with
          # deployment mode enabled, which implies --frozen).
          bundle config unset deployment

          bundle lock

          # Sanity: confirm we are still inside the git checkout.
          test -d .git
          git status --short Gemfile.lock || true

      - name: Commit updated Gemfile.lock
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -eo pipefail
          if git diff --quiet -- Gemfile.lock; then
            echo "Gemfile.lock is already up to date. Nothing to commit."
            exit 0
          fi

          git --no-pager diff -- Gemfile.lock | head -80 || true

          git add Gemfile.lock
          git commit -m "chore(deps): update Gemfile.lock for web-push gem

          Regenerated by the update-gemfile-lock workflow after adding
          the web-push gem to Gemfile."

          git push origin "${{ inputs.branch }}"
