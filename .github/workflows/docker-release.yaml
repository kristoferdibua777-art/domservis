name: docker-release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish to GHCR"
        required: true
        type: string
      publish_latest:
        description: "Also publish the latest tag"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "release-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/svib-dom-servis

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve publish tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            PUBLISH_LATEST="${{ inputs.publish_latest }}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"
            PUBLISH_LATEST="false"
          fi

          if [[ -z "${IMAGE_TAG}" ]]; then
            echo "IMAGE_TAG is required." >&2
            exit 1
          fi

          TAGS="${IMAGE_NAME}:${IMAGE_TAG},${IMAGE_NAME}:sha-${GITHUB_SHA}"

          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:develop"
          fi

          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Docker release"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Version tag: \`${{ steps.tags.outputs.image_tag }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Published tags:"
            IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "  - \`${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
